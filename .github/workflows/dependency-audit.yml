name: Dependency Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pip-audit
          pip install -r requirements/base.txt

      - name: Run pip-audit
        run: pip-audit --strict --desc on

  node-audit:
    name: Node dependency audit (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Non-blocking until Next.js 16 upgrade — known CVEs in next/postcss/swiper
    # require breaking major upgrades. Remove continue-on-error after upgrade.
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Run npm audit
        run: cd frontend && npm audit --audit-level=critical
