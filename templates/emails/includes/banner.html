<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%; background:{{ banner_bg|default:'#d9f99d' }};">
  <tr>
    <td class="email-padding" style="padding:32px 40px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
        <tr>
          <td width="72" valign="middle" class="stack-column center-mobile" style="width:72px; vertical-align:middle; padding-right:20px;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center" style="margin:0 auto;">
              <tr>
                <td align="center" valign="middle" width="64" height="64" style="width:64px; height:64px; border:4px solid {{ banner_text_color|default:'#050505' }}; border-radius:50%; font-family:Arial, Helvetica, sans-serif; font-size:34px; line-height:56px; font-weight:900; color:{{ banner_text_color|default:'#050505' }}; text-align:center;">
                  {{ banner_icon|default:"✓" }}
                </td>
              </tr>
            </table>
          </td>
          <td valign="middle" class="stack-column center-mobile" style="vertical-align:middle;">
            <p class="mobile-title" style="margin:0; font-family:Arial, Helvetica, sans-serif; font-size:32px; line-height:1; font-weight:900; text-transform:uppercase; color:{{ banner_text_color|default:'#050505' }};">
              {{ banner_title }}
            </p>
            {% if banner_subtitle %}
              <p style="margin:6px 0 0 0; font-family:Arial, Helvetica, sans-serif; font-size:15px; line-height:1.3; font-weight:700; color:{{ banner_text_color|default:'#050505' }};">
                {{ banner_subtitle }}
              </p>
            {% endif %}
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
