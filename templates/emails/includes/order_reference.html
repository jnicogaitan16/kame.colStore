{% if reference %}
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%; margin-top:28px; background:#ffffff; border:1px solid #e6e2d8; border-radius:10px;">
  <tr>
    <td style="padding:28px;">
      <p style="margin:0; font-family:Arial, Helvetica, sans-serif; font-size:12px; line-height:1.2; font-weight:900; color:#555555; letter-spacing:1.2px; text-transform:uppercase;">
        Referencia del pedido
      </p>
      <p style="margin:10px 0 0 0; font-family:Arial, Helvetica, sans-serif; font-size:30px; line-height:1.1; font-weight:900; color:#050505; word-break:break-all;">
        {{ reference }}
      </p>
    </td>
  </tr>
</table>
{% endif %}
