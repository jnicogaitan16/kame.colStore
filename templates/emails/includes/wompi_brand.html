{% if wompi_logo_url %}

    src="{{ wompi_logo_url }}"
    alt="Wompi"
    width="110"
    height="55"
    style="display:block; width:110px; max-width:110px; height:auto; border:0; outline:none; text-decoration:none; margin:0 auto;"
  />
{% else %}
  <span style="font-family:Arial, Helvetica, sans-serif; font-size:24px; line-height:1; font-weight:900; color:#111111; letter-spacing:-0.5px;">
    wompi
  </span>
{% endif %}
