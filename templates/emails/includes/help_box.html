<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%; margin-top:28px;">
  <tr>
    <td style="background:#fffdf6; border:1px solid #eee8dc; border-radius:10px; padding:22px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
        <tr>
          <td width="48" valign="top" class="stack-column center-mobile" style="width:48px; vertical-align:top; padding-right:16px;">
            <div style="font-family:Arial, Helvetica, sans-serif; font-size:28px; line-height:1; color:#c8ff1a; text-align:center;">
              &#9835;
            </div>
          </td>
          <td valign="top" class="stack-column center-mobile" style="vertical-align:top;">
            <p style="margin:0; font-family:Arial, Helvetica, sans-serif; font-size:15px; line-height:1.3; font-weight:900; color:#111111;">
              {{ help_title|default:"¿Algo con tu pedido?" }}
            </p>
            <p style="margin:8px 0 0 0; font-family:Arial, Helvetica, sans-serif; font-size:14px; line-height:1.5; color:#555555;">
              {{ help_text|default:"Escríbenos por WhatsApp." }}
            </p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
